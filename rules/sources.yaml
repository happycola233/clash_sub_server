# 按顺序匹配；相同条件只保留第一次出现的规则。
# 子服务先于公司主名单，IP 名单在域名之后。
upstream:
  repository: MetaCubeX/meta-rules-dat
  ref: meta

rulesets:
  - name: 客户端 IP 检测（固定 9 条）
    policy: IP 检测
    local_files: [ip_check.list]

  - policy: NETFLIX
    files: [geo/geosite/classical/netflix.list]
  - policy: HBO
    files: [geo/geosite/classical/hbo.list]
  - policy: YouTube
    files: [geo/geosite/classical/youtube.list]
  - policy: Disney
    files: [geo/geosite/classical/disney.list]
  - policy: 巴哈姆特
    files: [geo/geosite/classical/bahamut.list]
  - policy: OpenAI
    files: [geo/geosite/classical/openai.list]
  - policy: Anthropic
    files: [geo/geosite/classical/anthropic.list]
  - policy: Grok
    files: [geo/geosite/classical/xai.list]
  - policy: Telegram
    files: [geo/geosite/classical/telegram.list]
  - policy: X
    files: [geo/geosite/classical/twitter.list]
  - policy: Github
    files: [geo/geosite/classical/github.list]
  - policy: Tiktok
    files: [geo/geosite/classical/tiktok.list]
  - policy: Playstation
    files: [geo/geosite/classical/playstation.list]
  - policy: Xbox
    files: [geo/geosite/classical/xbox.list]
  - policy: Bilibili 海外
    files:
      - geo/geosite/classical/biliintl.list
      - geo/geosite/classical/bilibili@!cn.list
  - policy: Steam
    files: [geo/geosite/classical/steam.list]
  - policy: Google
    files: [geo/geosite/classical/google.list]
  - policy: Microsoft
    files: [geo/geosite/classical/microsoft.list]
  - policy: Apple
    files:
      - geo/geosite/classical/apple.list
      - geo/geosite/classical/apple-intelligence.list

  - name: NETFLIX IP
    policy: NETFLIX
    files: [geo/geoip/classical/netflix.list]
  - name: Telegram IP
    policy: Telegram
    files: [geo/geoip/classical/telegram.list]
  - name: X IP
    policy: X
    files: [geo/geoip/classical/twitter.list]
